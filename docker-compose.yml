# Base stack: postgres + redis + rabbitmq + app(API) + worker.
# Runtime secrets/hosts come from env / .env (see .env.example).
# Dev host port mapping is fixed in docker-compose.dev.yml (not parameterized).
#
# Dev (deps only, Go on host):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   go run ./cmd/server    # 终端 1：HTTP + 投递
#   go run ./cmd/worker    # 终端 2：消费 + 补偿
# Full stack locally:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d --build
# Base only (all services, no host ports for DB/Redis):
#   docker compose up -d --build

x-app-environment: &app-environment
  # In-compose network: service DNS names (not host localhost).
  DB_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-wood-bi_db}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
  RABBITMQ_BI_EXCHANGE: ${RABBITMQ_BI_EXCHANGE:-bi_exchange}
  RABBITMQ_BI_QUEUE: ${RABBITMQ_BI_QUEUE:-bi_queue}
  RABBITMQ_BI_ROUTING_KEY: ${RABBITMQ_BI_ROUTING_KEY:-bi_routingKey}
  RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
  RABBITMQ_WORKERS: ${RABBITMQ_WORKERS:-2}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  ENV: ${ENV:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-}

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wood-bi_db}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wood-bi_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-wood-bi:local}
    command: ["./server"]
    environment:
      <<: *app-environment
      SERVICE_NAME: ${SERVICE_NAME:-wood-bi}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # 与 app 同镜像；只跑消费与补偿，可独立 replicas 扩缩 AI 并发。
  worker:
    image: ${APP_IMAGE:-wood-bi:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./worker"]
    environment:
      <<: *app-environment
      SERVICE_NAME: ${SERVICE_NAME:-wood-bi}-worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
