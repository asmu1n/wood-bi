basePath: /api
definitions:
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  user.AdminCreateInput:
    properties:
      account:
        type: string
      avatar:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    required:
    - account
    - password
    type: object
  user.AdminUpdateInput:
    properties:
      avatar:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      role:
        type: string
    required:
    - id
    type: object
  user.LoginInput:
    properties:
      account:
        type: string
      password:
        type: string
    required:
    - account
    - password
    type: object
  user.QueryParams:
    properties:
      account:
        type: string
      id:
        type: integer
      name:
        type: string
      pageNum:
        type: integer
      pageSize:
        type: integer
      role:
        type: string
    type: object
  user.RegisterInput:
    properties:
      account:
        type: string
      checkPassword:
        type: string
      password:
        type: string
    required:
    - account
    - checkPassword
    - password
    type: object
  user.UpdateMyInput:
    properties:
      avatar:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: AI BI 后端（Go）：用户与图表分析
  title: wood-bi API
  version: "1.0"
paths:
  /user/add:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.AdminCreateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员创建用户
      tags:
      - user-admin
  /user/current:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 当前登录用户
      tags:
      - user
  /user/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: id
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            format: int64
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员删除用户
      tags:
      - user-admin
  /user/get:
    get:
      parameters:
      - description: 用户 ID
        format: int64
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员按 ID 获取用户
      tags:
      - user-admin
  /user/list/page:
    post:
      consumes:
      - application/json
      parameters:
      - description: 查询
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.QueryParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员分页查询用户
      tags:
      - user-admin
  /user/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - user
  /user/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注销
      tags:
      - user
  /user/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.RegisterInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - user
  /user/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.AdminUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员更新用户
      tags:
      - user-admin
  /user/update/my:
    post:
      consumes:
      - application/json
      parameters:
      - description: 资料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateMyInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新当前用户资料
      tags:
      - user
securityDefinitions:
  SessionAuth:
    description: 'Session cookie authentication. Example: session=your-session-id'
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
