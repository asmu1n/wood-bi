# Dev overlay: expose DB/Redis/RabbitMQ on fixed host ports; do not start app/worker by default.
# Host Go processes use code defaults (DB_HOST/REDIS_HOST=localhost).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   go run ./cmd/server    # HTTP + 异步投递
#   go run ./cmd/worker    # MQ 消费 + 滞留补偿
#
# Optional full stack in containers:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d --build

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI

  app:
    profiles: ["full"]
    ports:
      - "8080:8080"

  worker:
    profiles: ["full"]
